name: VPN Gate Node Check

on:
  # 定时检测: 默认每 30 分钟一次 (改成每小时: cron: "0 * * * *")
  schedule:
    - cron: "*/30 * * * *"
  # 手动点「Run workflow」立即跑一次
  workflow_dispatch:
  # 改了脚本/页面/本文件时自动跑一次, 方便排查
  push:
    branches: [main]
    paths:
      - ".github/workflows/check.yml"
      - "vpngate.py"
      - "check_nodes.py"
      - "web/**"
      - "requirements.txt"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check + build page
        run: python check_nodes.py
        env:
          # 检测端点可以写多个, 逗号分隔, 用第一个存活的; 全挂会自动降级为本地 TCP 探测
          CHECK_WORKERS: "https://check.helei.kdns.fr/check?sstp=vpn:vpn@,https://11.fafa100.ccwu.cc/check?sstp=vpn:vpn@"
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "60"
          LOCAL_PROBE: "1"
          HTTP_TIMEOUT: "60"

      - name: Upload result for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public
          path: public
          if-no-files-found: warn

      - name: Enable GitHub Pages (first run only)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API status: $code"
          if [ "$code" = "404" ]; then
            echo "首次运行: 启用 GitHub Pages (GitHub Actions 部署方式)"
            resp=$(curl -sS -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d '{"build_type":"workflow"}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
            echo "$resp"
            sleep 15
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: echo "site: ${{ steps.deployment.outputs.page_url }} (outcome: ${{ steps.deployment.outcome }})"
